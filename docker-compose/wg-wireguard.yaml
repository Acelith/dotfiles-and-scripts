volumes:
  etc_wireguard: null
services:
  wg-easy:
    environment:
      - LANG=it
      - WG_HOST=HOST
      - PASSWORD_HASH=  #Generated hash 32bit
      - WG_DEFAULT_DNS=1.1.1.1
      - WG_ALLOWED_IPS=10.0.1.0/24 # INsert local ip for accessing host LAN
      - UI_TRAFFIC_STATS=true
      - UI_CHART_TYPE=3
      - ENABLE_PROMETHEUS_METRICS=true
      - PROMETHEUS_METRICS_PASSWORD= #PRometheus password
    image: ghcr.io/wg-easy/wg-easy
    container_name: wg-easy
    volumes:
      - etc_wireguard:/etc/wireguard
    ports:
      - 51820:51820/udp
      - 51821:51821/tcp
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
      # - NET_RAW # ⚠️ Uncomment if using Podman
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
networks: {}
